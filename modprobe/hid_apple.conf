# /etc/modprobe.d/hid_apple.conf, shipped by apple-kb-monitor (backup= file:
# your edits survive upgrades).
#
# Why this file is still shipped (#68). On a current kernel the line below is
# redundant for an Apple keyboard: `modinfo -p hid_apple` gives fnmode
# "[3] = auto", and auto means 1 (media keys first, F1-F12 with Fn) on an
# Apple keyboard. It stays for three reasons:
#   1. It is the file `akmctl set fnmode N --persist` and `akmctl set param …
#      --persist` rewrite (through pkexec akm-helper, which touches only the
#      tokens of the `options hid_apple` lines and keeps everything else).
#      Dropping it from the package would have pacman move a file the user
#      changed that way to hid_apple.conf.pacsave at the next upgrade: the
#      chosen Fn mode would be lost at the following boot, without a word.
#   2. Whatever default the running kernel has ("auto" only exists on
#      recent ones), the first boot after install behaves the same, and as
#      post_install applies it right away (echo 1 > …/parameters/fnmode).
#   3. The Diagnostic page of the application compares the value applied
#      (sysfs) with the one configured in /etc/modprobe.d; without this file
#      it reads "configured = none (not persistent)".
# Side effect to know: fnmode is global to the hid_apple driver, so 1 also
# applies to a non-Apple keyboard handled by it (some Keychron), where auto
# would have chosen 2. Change it with `akmctl set fnmode N --persist`.
options hid_apple fnmode=1
