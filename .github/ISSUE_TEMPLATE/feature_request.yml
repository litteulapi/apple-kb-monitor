name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
      description: How it could work (widget, System Settings, akmctl, notifications...).
  - type: textarea
    id: macos
    attributes:
      label: How macOS does it (if relevant)
      description: The project only sends the keyboard what macOS sends; say if macOS has this feature.
  - type: input
    id: keyboard
    attributes:
      label: Keyboard model
      description: e.g. A1314, A1255, Magic Keyboard
