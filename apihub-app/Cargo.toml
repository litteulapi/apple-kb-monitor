[workspace]
members = [".", "akm-core", "apple-kb-monitord", "crates/akmctl", "crates/akm-helper"]
default-members = [".", "akm-core", "apple-kb-monitord", "crates/akmctl", "crates/akm-helper"]
resolver = "2"

[workspace.package]
version = "3.1.0"
edition = "2021"

[package]
name = "apihub-app"
version.workspace = true
edition.workspace = true
description = "Apple Bluetooth keyboard monitor — tray + GUI"

[dependencies]
akm-core = { path = "akm-core" }
apple-kb-monitord = { path = "apple-kb-monitord" }
eframe = "0.29"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "4"

[profile.release]
strip = true
lto = true
opt-level = "s"
