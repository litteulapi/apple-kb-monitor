[package]
name = "apihub-app"
version = "3.0.0"
edition = "2021"
description = "Apple Bluetooth keyboard monitor — tray + GUI, single binary"

[dependencies]
dirs = "5"
eframe = "0.29"
libc = "0.2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "4"

[profile.release]
strip = true
lto = true
opt-level = "s"
