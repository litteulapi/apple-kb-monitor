[package]
name = "apihub-app"
version = "3.0.0"
edition = "2021"
description = "DDC/CI monitor control + Apple keyboard telemetry — single binary GUI"

[dependencies]
dirs = "5"
eframe = "0.29"
libc = "0.2"
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
opt-level = "s"
