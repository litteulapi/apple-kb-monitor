[workspace]
members = [".", "akm-core"]
default-members = [".", "akm-core"]
resolver = "2"

[workspace.package]
version = "3.1.0"
edition = "2021"

[package]
name = "apihub-app"
version.workspace = true
edition.workspace = true
description = "Apple Bluetooth keyboard monitor — tray + GUI"

[dependencies]
akm-core = { path = "akm-core" }
dirs = "5"
eframe = "0.29"
libc = "0.2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "4"

[profile.release]
strip = true
lto = true
opt-level = "s"
