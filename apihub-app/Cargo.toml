[workspace]
members = [".", "akm-core", "apple-kb-monitord", "crates/akmctl", "crates/akm-helper"]
default-members = [".", "akm-core", "apple-kb-monitord", "crates/akmctl", "crates/akm-helper"]
resolver = "2"

[workspace.package]
version = "3.1.0"
edition = "2021"
license = "GPL-2.0-only"

[package]
name = "apihub-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Apple Bluetooth keyboard monitor — tray + GUI"

[dependencies]
akm-core = { path = "akm-core" }
apple-kb-monitord = { path = "apple-kb-monitord" }
eframe = "0.32"
libc = "0.2"
raw-window-handle = "0.6"
serde_json = "1"
zbus = "4"

# xdg_activation_v1 on the window's own Wayland connection (#270): the very
# versions winit already links, no new crate in the tree.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
