# cargo-deny / cargo-audit policy (#212). Run: cargo deny check advisories
# Every ignored advisory is justified below and must be re-examined at the next
# eframe / zbus upgrade (the paths all go through them).

[advisories]
version = 2
ignore = [
    # quick-xml 0.30.0 (eframe -> egui-winit -> accesskit_winit -> accesskit_unix
    # -> atspi -> zbus-lockstep -> zbus_xml) and 0.39.2 (wayland-scanner, a
    # proc-macro: build time only). DoS by crafted XML. The XML parsed is the
    # D-Bus introspection of the accessibility bus, written by the local
    # session, never by a remote party. Fix = quick-xml >= 0.41, i.e. an eframe
    # upgrade (0.29 -> 0.36 changes the egui API of the window, apihub-app/src,
    # tracked separately).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml DoS: local accessibility-bus XML only; fixed by the eframe upgrade" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml namespace allocation: same path, same reason" },
    # paste, ttf-parser: unmaintained, compile-time macro / font parsing of the
    # bundled egui fonts; no fix available short of the eframe upgrade.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained: proc-macro at build time (egui)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained: parses only the fonts bundled with egui" },
    # rand 0.8.5 through zbus 4: unsound only with a custom global logger that
    # calls rand::rng(); the daemon installs the tracing fmt subscriber only.
    # Fixed by zbus 5 (API change of the whole daemon, tracked separately).
    { id = "RUSTSEC-2026-0097", reason = "rand 0.8 unsound with a custom logger calling rand::rng(); not our logger" },
]
