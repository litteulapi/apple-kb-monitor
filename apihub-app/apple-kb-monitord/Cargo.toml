[package]
name = "apple-kb-monitord"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless Apple Bluetooth keyboard monitor: single owner of the hardware, BlueZ battery provider, session D-Bus interface"

[lib]
name = "apple_kb_monitord"
path = "src/lib.rs"

[[bin]]
name = "apple-kb-monitord"
path = "src/main.rs"

[dependencies]
akm-core = { path = "../akm-core" }
libc = "0.2"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
zbus = "4"
