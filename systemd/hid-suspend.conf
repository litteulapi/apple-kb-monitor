# /etc/apple-kb-monitor/hid-suspend.conf (#244, docs/VEILLE-HID.md)
#
# HID_CONTROL SUSPEND (0x13) before the computer sleeps and EXIT_SUSPEND (0x14)
# when it wakes, sent to each connected Apple Bluetooth keyboard as macOS
# bluetoothd does (one byte, once, on the HID control channel).
# Read by /usr/lib/apple-kb-monitor/akm-hid-control (apple-kb-monitor-suspend
# and apple-kb-monitor-resume system units). Must stay root-owned and not
# group/world writable, otherwise the feature is OFF.
#
# To turn it off: enabled = false   (or: systemctl mask apple-kb-monitor-suspend.service apple-kb-monitor-resume.service)
enabled = true
