# /etc/apple-kb-monitor/hid-suspend.conf (docs/HID-SLEEP.md)
#
# HID_CONTROL SUSPEND (0x13) before the computer sleeps and EXIT_SUSPEND (0x14)
# when it wakes, sent to each connected Apple Bluetooth keyboard as macOS
# bluetoothd does (one byte, once, on the HID control channel).
# Read by /usr/lib/apple-kb-monitor/akm-helper hid-control (apple-kb-monitor-suspend
# and apple-kb-monitor-resume system units). Must stay root-owned and not
# group/world writable, otherwise the feature is OFF.
#
#
# OFF by default since 2026-10-02. Measured on an A1314 (firmware 0x0050) with
# the computer awake: after SUSPEND the keyboard stays connected but answers no
# GET_REPORT and no longer types; EXIT_SUSPEND, sent twice, did not bring it
# back; the user had to switch Bluetooth off and on. Until the wake path is
# understood, turning this on can leave the keyboard dead after a wake.
# To turn it on: enabled = true
enabled = false
