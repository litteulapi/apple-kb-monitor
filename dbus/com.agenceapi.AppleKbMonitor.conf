<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  apple-kb-monitord (or apihub-app when the daemon is absent) exports its
  BlueZ battery provider from an anonymous (unique)
  bus name: BlueZ remembers the sender of RegisterBatteryProvider, so no
  well-known name is owned and no "own" rule is needed (issue #67).
  The only requirement is that an unprivileged session may call org.bluez.
-->
<busconfig>
  <policy context="default">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
