---
name: CI

# Runs on every push to main, audit/**, integration/** and roadmap/**, and on
# pull requests towards main or integration/**. Needs Actions enabled on the
# repository and a runner labelled ubuntu-latest (repository settings, not
# enabled by this file).
on:
  push:
    branches: [main, "audit/**", "integration/**", "roadmap/**", "fix/**"]
  pull_request:
    branches: [main, "integration/**"]

jobs:
  rust:
    name: Rust build, clippy, test (workspace)
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      # actions/checkout is a JavaScript action: the rust image has no Node.
      - name: Install Node (for JavaScript actions)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs ca-certificates git
      - uses: actions/checkout@v4
      - name: Install components
        run: rustup component add clippy
      - name: Build, clippy (warnings = errors), test, once for the whole workspace
        working-directory: apihub-app
        run: |
          set -eu
          cargo build --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Advisories (cargo deny, policy and justified ignores in apihub-app/deny.toml)
        working-directory: apihub-app
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories

  shell-c-udev:
    name: Version, shell, C, udev (no hardware)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs python3 \
            shellcheck gcc libc6-dev udev
      - uses: actions/checkout@v4
      - name: Single version (Cargo workspace = PKGBUILD = .SRCINFO = CHANGELOG)
        run: |
          set -eu
          cargo_v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' apihub-app/Cargo.toml | head -1)
          pkg_v=$(sed -n 's/^pkgver=//p' PKGBUILD)
          src_v=$(sed -n 's/^[[:space:]]*pkgver = //p' .SRCINFO)
          log_v=$(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md | head -1)
          echo "cargo=$cargo_v pkgbuild=$pkg_v srcinfo=$src_v changelog=$log_v"
          [ -n "$cargo_v" ] && [ "$cargo_v" = "$pkg_v" ] && [ "$cargo_v" = "$src_v" ] && [ "$cargo_v" = "$log_v" ]
      - name: No Python dependency in the package
        run: |
          ! grep -nE "python" PKGBUILD .SRCINFO
      - name: shellcheck
        run: |
          files="tests/live/check_keyboard.sh"
          for f in $(find systemd -type f 2>/dev/null); do
            head -1 "$f" | grep -Eq '^#!.*(ba)?sh' && files="$files $f"
          done
          shellcheck -S warning $files
      - name: Security files (unit hardening, polkit, rssi-helper group) and widget plain text
        run: |
          set -eu
          sh tests/check-security-files.sh
          python3 plasma/tests/check_plaintext.py
      - name: rssi-helper (gcc -Wall -Wextra -Werror)
        run: gcc -Wall -Wextra -Werror -o /tmp/rssi-helper rssi-helper.c
      - name: udevadm verify
        run: udevadm verify udev/70-apple-kb-hidraw.rules

  reverse-tools:
    name: Reverse-engineering tools (tests/live, compile and fixture tests, no hardware)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs \
            python3 python3-pytest
      - uses: actions/checkout@v4
      - name: py_compile (tests/live and the other dev scripts)
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 -r python3 -m py_compile
      - name: Fixture tests of the tools (no keyboard needed)
        run: python3 -m pytest tests/live/re -q

  # Same checks as `scripts/ci-local.sh` (the reference pipeline, run locally
  # and by .githooks/pre-push). No runner was registered on the instance on
  # 2026-10-01: see docs/QA-AUTOMATIQUE.md §5 before enabling Actions.
  qa-static:
    name: QA static (secrets, registry claims, redaction, versions, units)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates nodejs python3 systemd udev
      - uses: actions/checkout@v4
      - name: scripts/ci-local.sh (static steps)
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true
          git branch -f main origin/main 2>/dev/null || true
          scripts/ci-local.sh --only versions,secrets,claims,redaction,shell,udev
      - name: Keep the report
        if: always()
        run: cat scripts/out/latest/report.txt || true

  e2e:
    name: End-to-end window tests (Xvfb, simulated keyboard)
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
      # bubblewrap needs unprivileged user namespaces inside the container.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs git ca-certificates xvfb xdotool imagemagick \
            bubblewrap dbus strace python3 python3-gi python3-pil libgl1-mesa-dri libegl1 libxkbcommon-x11-0 \
            libxcursor1 libxi6 libxrandr2 fonts-dejavu-core
      - uses: actions/checkout@v4
      - name: tests/e2e/run.sh (exit 77 = environment without user namespaces = skipped)
        run: |
          set +e
          tests/e2e/run.sh --out e2e-out; rc=$?
          [ $rc = 77 ] && { echo "::warning::e2e skipped (no user namespaces in this runner)"; exit 0; }
          exit $rc
      - uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: e2e-captures
          path: e2e-out
