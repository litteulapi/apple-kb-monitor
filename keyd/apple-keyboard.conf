# keyd: F3-F6 of the Apple keyboards supported by apple-kb-monitor.
#
# OPTIONAL EXAMPLE (since 3.1.0-10, #246). The package installs it in
# /usr/share/doc/apple-kb-monitor/examples/keyd/, never in /etc/keyd/: the
# key mapping is done by the udev hwdb file of `akmctl keymap`. Use keyd only
# if you want these macros instead, and do NOT stack it on the hwdb mapping:
#   sudo install -Dm644 /usr/share/doc/apple-kb-monitor/examples/keyd/apple-keyboard.conf /etc/keyd/
#   keyd check /etc/keyd/apple-keyboard.conf
#   sudo systemctl restart keyd      # restart, NEVER `keyd reload` (see below)
# keyd 2.6.0: `keyd reload` leaves a dangling pointer (active_kbd) to the
# freed keyboard; the next click of a mouse keyd does not grab crashes it
# (SEGV, PC01 2026-10-01). Any config that grabs a keyboard triggers it, this
# file included: see docs/KEYD.md and tests/keyd/run-harness.sh.
#
# Device ids = the model table (apihub-app/akm-core/src/model.rs): BCM2042
# keyboards announce the USB vendor 05ac over Bluetooth, Magic Keyboards the
# Bluetooth SIG vendor 004c (and 05ac over their USB cable). Checked by
# tests/live/re/test_entrees_modeles.py and the akm-core LED tests: keyd
# relays LED events only to the keyboards it grabs (#125, #126).

[ids]
# A1255 (ANSI, ISO, JIS)
05ac:022c
05ac:022d
05ac:022e
# A1314 2009 (ANSI, ISO, JIS)
05ac:0239
05ac:023a
05ac:023b
# A1314 2011 (ANSI, ISO, JIS)
05ac:0255
05ac:0256
05ac:0257
# Magic Keyboard 2015 (A1644, A1843 numpad): Bluetooth, then USB cable
004c:0267
004c:026c
05ac:0267
05ac:026c
# Magic Keyboard 2021 (A2450, A2449 Touch ID, A2520 Touch ID + numpad)
004c:029c
004c:029a
004c:029f
05ac:029c
05ac:029a
05ac:029f
# Magic Keyboard 2024 USB-C (plain, Touch ID, Touch ID + numpad)
004c:0320
004c:0321
004c:0322
05ac:0320
05ac:0321
05ac:0322

[main]
# F3-F6 remapped, with and without Fn, for every hid-apple Fn table
# (fnmode=1: media keys by default, F-keys with Fn):
#   ALU (A1255/A1314)  F3 scale  F4 dashboard  F5 (none)         F6 numlock
#   Magic 2015         F3 scale  F4 dashboard  F5 (none)         F6 (none)
#   Magic 2021/2024    F3 scale  F4 search     F5 micmute        F6 sleep
#   older apple_fn     F5 kbdillumdown         F6 kbdillumup
# F6 on a Magic Keyboard 2021+ is KEY_SLEEP: remapped here, it never suspends.
f3 = macro(M-z)
scale = macro(M-z)
f4 = macro(M-g)
dashboard = macro(M-g)
search = macro(M-g)
f5 = macro(M-l)
kbdillumdown = macro(M-l)
micmute = macro(M-l)
f6 = macro(M-d)
numlock = macro(M-d)
kbdillumup = macro(M-d)
sleep = macro(M-d)

# F1/F2: PASSTHROUGH — keyd ne touche pas, passe au système
# (pas de remap = le keycode passe tel quel vers KWin)
